name: CI Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: Syntax & Dependency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate package.json & module syntax
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8'))"
          for f in electron/*.mjs src/*.js scripts/*.mjs; do
            node --check "$f"
          done
